name: smart_rabbit_second_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.2+7

environment:
  sdk: ">=3.4.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  shared_preferences: ^2.2.3
  get_storage: ^2.1.1
  dio: ^5.5.0+1
  google_fonts: ^6.2.1
  iconsax: ^0.0.8
  intl_phone_field: ^3.2.0
  font_awesome_flutter: ^10.7.0
  quickalert: ^1.1.0
  flutter_otp_text_field: ^1.1.3+2
  dotted_border: ^2.1.0
  file_picker: ^8.0.6
  mime: ^1.0.5
  http_parser: ^4.0.2
  lottie: ^3.1.2
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  flutter_spinkit: ^5.2.1
  barcode_widget: ^2.0.4
  collection: ^1.18.0
  device_preview: ^1.2.0
  responsive_builder: ^0.7.1
  simple_barcode_scanner: ^0.1.1
  skeletonizer: ^1.4.2
  dropdown_button2: ^2.3.9
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  google_maps_flutter: ^2.9.0
  geocoding: ^3.0.0
  flutter_launcher_icons: ^0.14.1

dev_dependencies:
  #  flutter_launcher_icons: ^0.14.1

  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 16 # android min sdk min:16, default 21
  image_path_android: "assets/icons/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/json_files/cities.json
    - assets/json_files/districts_lite.json
    - assets/json_files/regions_lite.json
    - lib/View/scanner/
    - assets/icons/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
